<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="KubeConvert">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#152238"/>
    </linearGradient>
    <linearGradient id="faceTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7DD3C0"/>
      <stop offset="100%" stop-color="#3AAFA9"/>
    </linearGradient>
    <linearGradient id="faceLeft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2B6B7A"/>
      <stop offset="100%" stop-color="#1B4450"/>
    </linearGradient>
    <linearGradient id="faceRight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4EC4B4"/>
      <stop offset="100%" stop-color="#2A8F86"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F4F7FA" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#9AE6D9" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- Transparent-friendly dark plate; remains readable on light pages via deep navy -->
  <rect width="960" height="540" rx="28" fill="url(#bg)"/>

  <!-- Isometric cube (left) -->
  <g transform="translate(210 270)">
    <!-- top -->
    <polygon points="0,-110 95,-55 0,0 -95,-55" fill="url(#faceTop)"/>
    <!-- left -->
    <polygon points="-95,-55 0,0 0,110 -95,55" fill="url(#faceLeft)"/>
    <!-- right -->
    <polygon points="95,-55 0,0 0,110 95,55" fill="url(#faceRight)"/>
    <!-- conversion chevron etched on top face -->
    <path d="M-28,-62 L8,-42 L-8,-42 L28,-22" fill="none" stroke="#0B1220" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity="0.35"/>
  </g>

  <!-- Transformation arrow into second cube -->
  <g transform="translate(430 270)" fill="url(#arrow)">
    <rect x="0" y="-14" width="90" height="28" rx="8"/>
    <polygon points="90,-34 150,0 90,34"/>
  </g>

  <!-- Transformed isometric cube (right), slightly rotated motif via offset -->
  <g transform="translate(690 270)">
    <polygon points="0,-100 86,-50 0,0 -86,-50" fill="url(#faceTop)"/>
    <polygon points="-86,-50 0,0 0,100 -86,50" fill="url(#faceLeft)"/>
    <polygon points="86,-50 0,0 0,100 86,50" fill="url(#faceRight)"/>
    <!-- open face mark suggesting converted output -->
    <polygon points="-24,-18 24,-18 0,10" fill="#0B1220" opacity="0.28"/>
  </g>

  <!-- Wordmark -->
  <text x="480" y="470" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="54" font-weight="700" fill="#F4F7FA" letter-spacing="1">KubeConvert</text>
  <text x="480" y="508" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="20" fill="#9AE6D9" letter-spacing="3">INTERROGATE · EXPLAIN · ACCELERATE</text>
</svg>
